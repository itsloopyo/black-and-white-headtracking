;  black and white head tracking - default config

[Network]
Port=4242
EnableOnStartup=1

[Sensitivity]
Yaw=1
Pitch=1
Roll=1
InvertYaw=0
InvertPitch=0
InvertRoll=0

[Smoothing]
;  Covers rotation and position alike. Which value is used is picked per
;  connection from where the tracker sends from: LocalSmoothing for a
;  tracker on this PC, RemoteSmoothing for a device on the network (a
;  phone over WiFi, say). 0.0 instant, up to 0.99 max. Nothing floors
;  either, so 0.0 really is zero-latency tracking.
LocalSmoothing=0
RemoteSmoothing=0.15

[Deadzone]
Yaw=0
Pitch=0
Roll=0

[Position]
;  6DOF head position, applied camera-local as the final camera shift
Enabled=1
;  WorldScale = engine units per metre of head movement; main tuning knob
WorldScale=40
;  ZoomReference = focal distance WorldScale is tuned at; 0 = auto-lock first zoom
ZoomReference=0
;  ZoomScaleMax = clamp on zoom scaling [1/max, max]; lower if zoom-out too strong
ZoomScaleMax=2.5
SensX=1
SensY=1
SensZ=1
InvertX=0
InvertY=0
InvertZ=0
;  Movement envelope in metres before world scaling
LimitX=0.3
LimitY=0.2
LimitZ=0.4
LimitZBack=0.1

[Hotkeys]
Toggle=0x23
YawMode=0x22
;  Page Up: cycle 6DOF -> rotation-only -> position-only
ModeCycle=0x21
DebounceMs=200

[View]
;  true = horizon-locked yaw (default), false = camera-local yaw
WorldSpaceYaw=1
