; Black & White (2001) head tracking configuration

[Network]
; UDP port for OpenTrack data
Port=4242
EnableOnStartup=true

[Sensitivity]
; Per-axis multipliers (0.1 - 5.0)
Yaw=1.0
Pitch=1.0
Roll=1.0
InvertYaw=false
InvertPitch=false
InvertRoll=false

[Smoothing]
; Covers rotation and position alike. Which value is used is picked per
; connection from where the tracker sends from: LocalSmoothing for a tracker on
; this PC, RemoteSmoothing for a device on the network (a phone over WiFi, say).
; 0.0 instant, up to 0.99 max. Nothing floors either, so 0.0 really is
; zero-latency tracking.
LocalSmoothing=0.0
RemoteSmoothing=0.15

[Deadzone]
; Degrees of dead-zone before tracking input is applied (0 - 30)
Yaw=0.0
Pitch=0.0
Roll=0.0

[Position]
; 6DOF head position, applied camera-local as the final camera shift
Enabled=true
WorldScale=40.0    ; engine units per metre of head movement - main tuning knob
ZoomReference=0.0  ; focal distance WorldScale is tuned at; 0 = auto-lock first zoom
ZoomScaleMax=2.5   ; clamp on zoom scaling [1/max, max]; lower if zoom-out too strong
SensX=1.0
SensY=1.0
SensZ=1.0
InvertX=false
InvertY=false
; InvertZ is for a tracker that sends depth backwards, not for a lean that
; feels reversed. It is applied before the LimitZ / LimitZBack clamp, so
; turning it on also swaps the travel budgets to 0.10m forward and 0.40m back.
InvertZ=false
; Movement envelope in metres, before world scaling
LimitX=0.30
LimitY=0.20
LimitZ=0.40        ; forward lean (generous)
LimitZBack=0.10    ; backward lean (restricted)

[Hotkeys]
; Virtual-key codes (hex). Defaults: End=0x23, PageDown=0x22, PageUp=0x21
Toggle=0x23
YawMode=0x22
; Page Up: cycle 6DOF -> rotation-only -> position-only
ModeCycle=0x21
DebounceMs=200

[View]
; true = horizon-locked yaw (default, "up" stays world-up), false = camera-local yaw
WorldSpaceYaw=true

[Logging]
; HeadTracking.log is written next to runblack.exe and starts fresh every
; launch (the previous one is kept as HeadTracking.prev.log).
; PositionTrace adds one line a second for the first minute of tracked
; position - head metres, clamped metres, engine offset and focal distance.
; Turn it on to tune WorldScale, or to read a focal value for ZoomReference.
PositionTrace=false
