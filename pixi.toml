[workspace]
name = "black-and-white-headtracking"
version = "0.2.1"
description = "Head tracking mod for Black & White (2001) using OpenTrack UDP and the cameraunlock-core shared library"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
# B&W is a 32-bit DirectX 7 game - everything is built x86.
sync          = { cmd = "git submodule update --remote cameraunlock-core" }
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = "powershell -Command \"if (-not (Test-Path 'build/CMakeCache.txt')) { cmake -B build -A Win32 } else { Write-Host 'Build already configured, skipping setup' -ForegroundColor Yellow }\"" }
build         = { cmd = "cmake --build build --config Debug",   depends-on = ["setup"] }
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
install       = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build-release"] }
uninstall     = "scripts\\uninstall.cmd"
# The host-side unit tests and the config differential test, in their own tree (build-tests/).
test          = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1" }
build-tests   = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -BuildOnly" }
package       = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release", "test"] }
# Rewrite config/HeadTracking.ini, the committed copy of the CameraUnlock.ini the mod creates at
# first launch, from the config table after a change to a row, a comment or a default, then
# rewrite the per_game of launcher-manifest.json's config descriptor from it.
render-config = { cmd = "build-tests/Debug/config_tests.exe --render-config config/HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-tests"] }
# Checks the newest installer and Nexus ZIPs in release/ against core's manifest and config
# rules. Run it after package.
validate-manifest = { cmd = "node cameraunlock-core/scripts/validate-manifest.mjs" }
release       = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }
update-deps   = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }
clean         = { cmd = "powershell -Command \"if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green\"" }
clean-all     = { cmd = "powershell -Command \"if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'build-tests') { Remove-Item 'build-tests' -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }\"" }
ghidra-script = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/ghidra-headless.ps1" }

[dependencies]
# >=4.1 for the "Visual Studio 18 2026" generator (CI runners dropped VS 2022);
# upper bound keeps the locked build >2 weeks old.
cmake = ">=4.1,<4.4.1"
# Runs the migrated-config lint in `test`, render-config's encode-seed.mjs and core's
# validate-manifest, pinned to the build cameraunlock-core's own lock resolved.
nodejs = "==26.5.0"
